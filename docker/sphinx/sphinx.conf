searchd
{
    log = /dev/stdout
    query_log = /dev/stdout
}

index bitrix
{
    path = /opt/sphinx/index/bitrix
    #main settings
    type = rt
    #choose appropriate type of morphology to use
    #morphology = lemmatize_ru_all, lemmatize_en_all, lemmatize_de_all, stem_enru
    morphology = stem_enru, soundex
    #these settings are used by bitrix:search.title component
    min_prefix_len = 2
    #all fields must be defined exactly as followed
    field = title
    field = body
    attr_uint = module_id
    attr_string = module
    attr_uint = item_id
    attr_string = item
    attr_uint = param1_id
    attr_string = param1
    attr_uint = param2_id
    attr_string = param2
    attr_uint = date_change
    attr_uint = date_to
    attr_uint = date_from
    attr_uint = custom_rank
    attr_uint_set = tags
    attr_uint_set = right
    attr_uint_set = site
    attr_uint_set = param
}
